version: 1.0.0
location: local # local / dev / prd
hostIp: 
backend:
  checkInterval: 30
  serviceCheckInterval: 10
  checkThreshold: 3
  backendPort: 8101
html:
  dir: '../front/projects/web/dist'
  load: false
  sitePort: 8100
cert:
  siteCertFile: './certs/cert.crt'
  siteKeyFile: './certs/key.key'
  siteCertDomain: 'localhost'
  siteCertEnabled: false  # 只控制web站点是否启用
  certCacheFolder: './certs'
db:
  root: './humpback.db'
  timeout: 5s
  sessionTimeout: 12h
  sessionGCInterval: 24h
  activityGCInterval: 24h
  activityRetentionDay: 120  #单位：天
  statisticsGCInterval: 24h
  statisticsRetentionDay: 32 #单位：天
admin:
  username: humpback   # 长度2-100
  password: humpback # 长度8-20