version: 1.0.0
location: prd
hostIp:
backend:
  checkInterval: 30
  serviceCheckInterval: 10
  checkThreshold: 3
  backendPort: 8101
html:
  dir: './web'
  load: true
  sitePort: 8100
cert:
  siteCertFile: '/workspace/certs/cert.pem'
  siteKeyFile: '/workspace/certs/key.pem'
  siteCertDomain: ''
  siteCertEnabled: false  # 只控制web站点是否启用
  certCacheFolder: '/workspace/certs'
db:
  root: '/workspace/data/humpback.db'
  timeout: 5s
  sessionTimeout: 12h
  sessionGCInterval: 24h
  activityGCInterval: 24h
  activityRetentionDay: 120  #单位：天
  statisticsGCInterval: 24h
  statisticsRetentionDay: 32 #单位：天
admin:
  username: humpback   # 长度2-100
  password: humpback # 长度8-20